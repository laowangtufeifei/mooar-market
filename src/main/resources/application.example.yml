server:
  port: 8080

spring:
  application:
    name: mooar-market
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mooar-market?cachePrepStmts=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: your-db-password

mybatis:
  configuration:
    map-underscore-to-camel-case: true

market:
  fsl:
    url: "http://127.0.0.1:6699"
    appKey: "your-fsl-appkey"
    appSecret: "your-fsl-appsecret"
    addressField: ""
    timeoutMs: 5000
    codeCacheSeconds: 600
  chain:
    rpc: "https://lb5.stepn.com"
    chainId: 137
    masterAddress: "0x0000000000000000000000000000000000000000"
    encryptKey: "your-aes-encrypt-key-base64"
    gasLimit: 100000
  item:
    imagePrefix: "http://mooar-market/"
  scan:
    startBlock: 0
    confirmBlocks: 12
  search:
    cacheTtlSeconds: 60
    cacheMaxSize: 2000
    maxPageSize: 100
  admin:
    token: "your-admin-token"
    statsZone: "Asia/Shanghai"
  fee:
    withdrawFee: 100
    tradeFeeRate: 6
